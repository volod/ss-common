[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-common"
version = "0.1.0"
description = "Shared contracts (ss_contracts) and light runtime helpers (ss_kit) for the ss services"
readme = "README.md"
# Raspberry Pi OS Bookworm ships Python 3.11; the edge tier installs this package there.
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "selfsuvis contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# The base install runs on the Pi: `make footprint` fails if torch, numpy, or transformers
# enter its resolution for aarch64 or x86_64 Linux.
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# FastAPI dependencies, security headers, and JWT validation (ss_kit.web).
web = [
  "fastapi>=0.115",
  "pyjwt[crypto]>=2.9",
]
# MQTT TLS and mTLS client settings and topic builder (ss_kit.mqtt).
mqtt = [
  "aiomqtt>=2.3",
  "pyyaml>=6.0",
]
# Contract validation and generation (ss-contracts CLI); never needed at runtime.
tooling = [
  "fastavro>=1.9",
  "pyarrow>=16",
  "pyyaml>=6.0",
]
dev = [
  "complexipy==6.0.0",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "radon==6.0.1",
  "ruff>=0.11,<0.17",
  "shellcheck-py==0.11.0.1",
]

[project.scripts]
ss-plan = "ss_kit.quality.plan_summary:main"

[project.urls]
Repository = "https://github.com/volod/ss-common"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ss-split]
# ss-common is the root of the staged-project graph: it reaches no sibling.
siblings = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/ss_contracts", "src/ss_kit"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: resolves packages from the package index (skipped with SS_OFFLINE=1)",
]
